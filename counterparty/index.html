<body>
  <script id="api-reference" type="application/json">{"openapi":"3.1.0","info":{"title":"Interstice Counterparty (CP) External API","version":"v1","description":"You are connecting as a **Liquidity Provider** on the Interstice Swap Engine.\nInstitutions request quotes; you make markets; both legs settle atomically\nbetween Canton Network and an enabled EVM or Solana network. Either the whole\nswap completes or every leg refunds. There is no state in which one side pays\nand the other does not.\n\nYou never talk to the orchestrator directly. You talk to the **counterparty\ngateway**. Interstice issues two things when your organization is accepted:\n\n| You receive | What it is |\n|---|---|\n| Gateway URL (`CP_GATEWAY_URL`) | Hostname for this environment, including the `/swap` prefix. Dev, QA, and production are different hosts and different key spaces. |\n| Entity API key (`cpk_…`) | The secret that authenticates your organization. Shown once. This **is** authentication — there is no login session on this plane. |\n\nPaste that key into this page's client. The first request is **First\nsuccessful call** under Authentication (`GET /config`) — use the language\ndropdown there. Wire only the URL and the key; discover the rest.\n\n## What we do and what you do\n\nWe prepare unsigned transactions and verify on-chain events. **You sign.** Your\nCanton Ed25519 key and your EVM or Solana signer never leave your process. We\ncannot move your funds. That is the product, not a setting.\n\nThere are two named products on the same gateway and the same key:\n\n- **`xswap`** — RFQ, quotes, HTLC settlement. This is the default path in these\n  pages.\n- **`convene`** — a non-custodial spot order book on Canton. Same authentication,\n  different routes. See Convene when you need it.\n\nAccount routes shared by both — `config`, `me/**`, `webhooks/**`,\n`automation`/`automations` — stay at the gateway's root, outside either\nproduct namespace.\n\n## Three pages, in order\n\n1. **[Authentication](#tag/authentication)** — the `cpk_…` key you were given,\n   how to make a first successful call, and how you mint, list, and revoke\n   further keys yourself. API keys are the authentication mechanism; they are\n   not a separate product.\n2. **[Setup](#tag/setup)** — you still cannot trade. Setup is the ceremony that\n   puts *your* Canton wallet on *our* participant so we can prepare ledger\n   commands as you. You create the key; we never generate it. When setup is\n   done you have a hosted party, inbound Canton Coin, and a second (bot)\n   credential for the always-on process.\n3. **Integration** — quote RFQs, verify webhooks, settle.\n\nThe generated contract is the API Reference. It is\nproduced from `external-openapi.json`. Treat that file, not a GitBook copy, as\ncurrent.\n\n## What this is not\n\n- Not the institution (taker) product. You will not see taker reports or other\n  organizations' data.\n- Not Identity login. Portal JWTs and Identity `isk_…` keys are rejected at\n  the gateway.\n- Not a custodian. Default integration (Pattern 1b) hosts **your** key on our\n  participant. If you already run a Canton validator you can stay self-hosted\n  (Pattern 1a) and skip the relay. See Architecture.\n"},"servers":[{"url":"https://{gatewayHost}/swap/external/cp/v2","variables":{"gatewayHost":{"default":"api.interstice.io","description":"Per-environment cp-gateway hostname, provided at onboarding (dev / qa / production differ)."}}}],"tags":[{"name":"Authentication","description":"There is no username and no Identity session on this plane. You authenticate\nwith an **API key** on every request. Paste it into this page's client\n(`Authorization: Bearer`). Keys do not work across environments\n(`cpk_live_…` vs `cpk_test_…`).\n\nWhen your organization is accepted, Interstice issues the first entity key\nout of band. Shown **once**. Put it in a secret manager the same day. After\nthat, **you** mint, list, and revoke further keys with the three operations\non this page.\n\nThat first key authenticates the **organization**, not a person and not a\nCanton party. It is enough to create and host a Canton wallet, register your\nEVM/SVM wallets, quote, and mint more keys. It is **not** what you put in an always-on settlement bot — that\nbot gets a narrower `auto_…` key after Setup.\n\n## First successful call\n\nUse the language dropdown on **First successful call** below (`GET /config`).\nCurl, Python, Node, and the rest are generated from the operation — there is\nno separate SDK snippet. A 200 with `pairs` and `networks` means the key\nworks.\n\n| Status | Meaning |\n|---|---|\n| 401 | Missing, unknown, revoked, or not a swap-side key. Identity `isk_…` keys land here. |\n| 403 | The key resolved but is not allowed on this route (wrong role, or an `auto_…` credential on an owner-plane path). |\n| 429 | More than 600 requests/min on this key. `Retry-After` is in seconds. |\n\n## Two families\n\n| Key | Who creates it | Holds it | What it is for |\n|---|---|---|---|\n| `cpk_…` | Interstice (first one), then **you** below | Operators, secret manager, bootstrap jobs | Owner plane: wallets, automations, grants, quoting, webhooks, minting keys |\n| `auto_…` | You, per automation, after Setup | The settlement bot only | Runtime only. Cannot mint keys, create wallets, or widen its own authority |\n\n## Mint, list, revoke\n\nRaw secrets are returned **once**. List responses carry truncated hashes\nonly. `{prefix}` on revoke is the **first 8 hex characters of `keyHash`**,\nnot the `cpk_test_ab12` display prefix.\n\nRotate without an outage: mint a new key → deploy it → revoke the old one.\nDo not revoke first. A leaked key is a self-service revoke, not a support\ncall. Do **not** mint `auto_…` here — those are minted per automation after\nSetup, they must expire (at most 400 days), and they 403 on this surface.\n\n## Next\n\nAuthentication is done when First successful call returns 200. You still\nhave no Canton party on our participant. That is Setup.\n"},{"name":"Setup","description":"You have a working API key. You still cannot settle a swap.\n\nSetup hosts **your** Canton key on **our** participant so we can prepare\ntransactions as you. You generate the keypair. You send us the **public**\nkey only — never the private key, never a seed, never a mnemonic. You sign\nevery topology and funding transaction. We never hold the private key, and\nno route on this page accepts one.\n\nA counterparty may hold as many Canton wallets as it wants (see\n[Create a second wallet](#create-a-second-wallet) below). Every operation\npast creation binds an explicit `walletId` — there is no implicit \"the\"\nwallet, so a multi-wallet organization is never guessing which one an\naction lands on.\n\nWhen this page is finished you have a hosted party, its Amulet factory\nprimed, inbound Canton Coin actually arriving (auto-accept), and a second\n(bot) key so the owner wallet stays cold. Only the entity key (`cpk_…`) can\nrun these routes. An `auto_…` key is 403.\n\nThe operations on this page use the same language dropdown as\nAuthentication. Signatures are **your** Ed25519 over the hashes we return —\nthe snippets show the HTTP, not the signing.\n\n## What you need\n\n- The `cpk_…` key from Authentication.\n- A Canton Ed25519 key you generate yourself (Interstice Wallet app, or your\n  HSM / custody). You send us the public key; we derive the party id and\n  return it — you never send us a party id to trust, and we recompute the\n  fingerprint ourselves regardless of what you send.\n- An EVM wallet on the same owner, `ready` — required for automation. The\n  grant will only ever pay that address.\n- An SVM (Solana) wallet only if you quote Solana pairs.\n\n## Five steps, one wallet\n\n1. **Create** (`POST /me/wallets/canton`) — send your public key, get back an\n   unsigned topology bundle.\n2. **Activate** (`POST /me/wallets/canton/:walletId/activate`) — sign it,\n   twice: once to host the party, once to prime its Amulet factory.\n3. **Fund it and check balance** (`GET /me/wallets/canton/:walletId`) — the\n   readiness gate, not an afterthought.\n4. **Set auto-accept** (preapproval) — with the revoke pair, so it isn't a\n   one-way door.\n5. **Ready-to-settle checklist** — every item is a field on the same detail\n   `GET`.\n\n### 1. Create\n\n`POST /me/wallets/canton` with `{ publicKey }`. That's the whole minimum\nbody — `hint` and `metadata` (see [Metadata](#metadata) below) are optional.\nWe never generate or hold the key behind that public key: you generate the\nEd25519 keypair, we only ever see the public half, and everything this route\nreturns is *unsigned* — a topology bundle for you to sign off-platform. This\nis the non-custody boundary, not a footnote on it.\n\nThe response:\n\n| Field | What it is |\n|---|---|\n| `walletId` | The id every later route binds to. Not a party id — save it. |\n| `partyId` | `{hint}::{fingerprint(publicKey)}`, computed and returned by us. We recompute this from your key regardless of anything you send — there is no `partyId` field in the request. |\n| `status` | `PENDING_SIGNATURE` on a fresh wallet. |\n| `isPrimary` | A hint for your own UI. Read-only this release — the first Canton wallet on the chain takes the slot; every later one registers `false`. |\n| `topologyTxs` | The unsigned bundle. Sign each and move to Activate. |\n\nRe-posting the same public key is safe: if the wallet is still\n`PENDING_SIGNATURE` you get it back (200, not 201) with a fresh\n`topologyTxs` bundle — the first one expires after 10 minutes uncommitted.\n\n### 2. Activate\n\nTwo round trips on the **same URL**, `POST /me/wallets/canton/:walletId/activate`\n— the body shape tells the server which phase you're in. This is two calls\nbecause hosting the party and priming its Amulet factory are two separate\non-ledger operations, and both need *your* signature. We hold no key that\ncould sign either for you, so there is no way to collapse this to one call\nwithout custody — the extra round trip is the non-custody boundary being\ncharged, not ceremony for its own sake.\n\n**Phase 1 — host the party.** Sign each `topologyTxs[].hash` from Create\nwith your owner key and send them back:\n\n```\nPOST /me/wallets/canton/:walletId/activate\n{ \"signedTxs\": [{ \"signedHash\": \"...\", \"signedBy\": \"<your public key>\" }] }\n```\n\nThe response is `status: ACTIVE` (already primed — rare, but possible on a\nre-run) or `status: PENDING_FACTORY` with a `factory` object: a prepared\ntransaction for the Amulet factory create.\n\n**Phase 2 — prime the factory.** Only when phase 1 left you at\n`PENDING_FACTORY`. Sign the prepared transaction from that response and send\nit back on the *same* URL:\n\n```\nPOST /me/wallets/canton/:walletId/activate\n{ \"factory\": { \"preparedTransaction\": \"...\", \"preparedTransactionHash\": \"...\",\n               \"hashingSchemeVersion\": \"...\", \"signatureBase64\": \"...\" } }\n```\n\n`status: ACTIVE` means hosted **and** primed. A wallet that is hosted but\nnot primed cannot lock Canton Coin — the first settlement attempt would 409,\nnot the tenth. If a platform adapter upgrade ever un-primes a wallet, it\ndrops back to `PENDING_FACTORY` and phase 2 is how you re-prime it; there is\nno separate \"re-prime\" button.\n\n### 3. Fund it and check balance\n\n`GET /me/wallets/canton/:walletId` returns every supported token balance —\nnot just Canton Coin, so you don't need a second call per instrument. This\nis the readiness gate, not a convenience read: a hosted, primed wallet with\nzero Canton Coin still cannot lock, so an unfunded wallet fails at the first\nRFQ rather than here at setup. Check it before you consider setup done.\n\nThen **you** send CC to the `partyId` from Create — we do not fund you.\n\n### 4. Set auto-accept\n\nInbound Canton Coin is auto-accepted only while a **TransferPreapproval** is\nlive on the party. Without one, a deposit strands as a Pending\nTransferInstruction with no accept path. You sign it; the platform cannot.\n\n**Turn it on:**\n\n```\nPOST /me/wallets/canton/:walletId/preapproval/prepare   →  unsigned tx (or\n                                                             ACTIVE, no-op)\nPOST /me/wallets/canton/:walletId/preapproval/submit     →  sign, relay\n```\n\n**Turn it off** — this used to have no path at all; it does now, alongside\nthe pair above so it's documented as a matched set, not an afterthought:\n\n```\nPOST /me/wallets/canton/:walletId/preapproval/revoke/prepare  →  unsigned tx\n                                                                   (or NONE)\nPOST /me/wallets/canton/:walletId/preapproval/revoke/submit   →  sign, relay\n```\n\n**Review it on a cadence.** Subscribe to `preapproval.expiring` (fires 24\nhours before expiry), or re-read the detail `GET`'s `preapproval.expiresAt`.\nRenew with the same prepare → sign → submit path; a new `expiresAt` re-arms\nthe alert.\n\n### 5. Ready-to-settle checklist\n\nEvery item below is a field on the same `GET /me/wallets/canton/:walletId`\n— one call answers \"can this wallet settle?\" instead of four.\n\n| You are done when | Field |\n|---|---|\n| The wallet is hosted on our participant | `readiness.hosted: true` |\n| It holds Canton Coin (or whatever instrument the swap needs) | `readiness.funded: true`, checked against `balances[]` |\n| Auto-accept is live | `readiness.preapproved: true` |\n| The Amulet factory is primed | `readiness.factoryPrimed: true` |\n| All four together | `status: \"ACTIVE\"` |\n\n## Metadata\n\nAttach your own keys to a wallet at Create or later via\n`PATCH /me/wallets/canton/:walletId/metadata` — your internal account id,\ndesk, book, whatever helps you correlate. We store it, return it verbatim on\nevery `GET`, and never parse it, route on it, or use it for authorization —\nit is opaque to us by design.\n\nIt is **scoped to the swap product** and isolated from any other product's\nmetadata on the same wallet; you see your own keys directly (`{ \"accountId\":\n\"ACME-1\" }`), never wrapped in a namespace.\n\nBounds, checked on the merged result so a sequence of small patches can't\nwalk past the cap:\n\n| Rule | Limit |\n|---|---|\n| Value shape | Flat object — no nested objects or arrays as values |\n| Key count | 32 |\n| Serialized size | 4096 bytes |\n| Key format | ≤ 64 chars, `[A-Za-z0-9._-]` |\n| Value type | `string` (≤ 512 chars), `number`, `boolean`, or `null` |\n| Reserved keys | `kind`, `validator` — these are our own stamps, rejected on write |\n\n`PATCH { metadata: { \"desk\": null } }` deletes `desk` — a `null` value reads\nas gone on every later `GET`.\n\n## Create a second wallet\n\nMultiple Canton wallets per organization are fully supported — repeat\n[Create](#1-create) with a different public key:\n\n```\nPOST /me/wallets/canton\n{ \"publicKey\": \"<second Ed25519 public key, hex>\" }\n```\n\nThe response is the same shape, with its own `walletId` and `partyId`. Its\n`isPrimary` comes back `false` — the first wallet on the chain already holds\nthat slot, and this release ships no way to move it. Activate, fund, and set\nauto-accept on the new `walletId` exactly as above; nothing about a second\nwallet is a different code path.\n\n`GET /me/wallets/canton` lists every wallet you've created (no ledger\nreads — cheap to poll), and every swap or settlement route that touches a\nCanton wallet takes an explicit `walletId` for exactly this reason: with more\nthan one wallet, there is no \"the\" wallet for the platform to guess at.\n\n## After hosting\n\nDo not put the owner wallet key in an always-on process. Automation is a\n**different** Ed25519, an AutomationParty whose namespace is that key, and\nan `auto_…` API key minted under Automations. Rotation is a new\nautomation, not a key swap.\n\nQuoting and settlement are later on this explorer (RFQ, Swaps — including the\nnamed accept/lock/claim/refund signing primitives).\nThe venue plane is the Convene explorer.\n"},{"name":"Wallets","description":"A Canton wallet is a party hosted on the Interstice participant. You generate the\nEd25519 keypair; we never see the private key. The party id is **derived** from your\npublic key — `<hint>::fingerprint(publicKey)` — so it is recomputed and verified here,\nnever taken on trust. Because you hold the key, every ledger operation is\nprepare-then-submit: we build the unsigned transaction, you sign it, we submit. That is\nnon-custody, not ceremony.\n\nCanton wallets are **created** here. EVM and Solana wallets are registered instead —\nthey already exist on chains we do not run, so you prove control rather than mint one.\nYou may hold as many as you want, and every wallet-scoped call binds an explicit\n`walletId`; there is no implicit \"your wallet\".\n\nA wallet is not ready to settle just because it exists. Hosted is not funded, and funded\nis not yet able to lock. The detail GET answers \"can this wallet trade?\" in one call —\nstatus, every supported token balance, pre-approval, and factory health. Metadata is\nyours: we store and return it verbatim and never interpret it."},{"name":"Discovery","description":"`GET /config` is the first call a new integration makes: networks, assets, the\ntradeable pair catalog and platform parameters in one response. Wire only the\ngateway URL and an entity key to reach it.\n\nIt is the authoritative answer to what THIS environment supports — which chains are\nenabled and which assets are live differ per environment. Read them here rather than\nhardcoding them; new chains and assets land as data, not as a release."},{"name":"Profile","description":"Who you are to the platform: your entity, your status, and the trading pairs you have\nopted into. `GET /me` reads it.\n\nPair selection governs which RFQs reach you. An empty selection means the dynamic default\n— every live pair, including ones added later. Selections are made with catalog **ids**\n(`eth-cc`), never slash labels (`ETH/CC`); the slash form is a display key and is rejected\nhere."},{"name":"Pairs","description":"Every pair is a **corridor**: exactly one Canton asset and one external asset. The legs\nare named `external` and `canton` — deliberately not base/quote, because nothing here is\npriced in the other leg and `quote` already means an RFQ price quote on this surface.\n\nA pair carries an `id` (e.g. `eth-cc`), which is what a grant policy's `allowedPairs`\nauthorizes against, and a display `key` (e.g. `ETH/CC`) carried by RFQs. Status is `live`\nor `coming_soon`. The external side spans Ethereum, Robinhood Chain and Solana today, but\nthe catalog is data-driven: dispatch signers and encoders on each asset's `family`\n(`evm`, `svm`, `canton`), never on the chain name."},{"name":"RFQ","description":"The quoting surface, and a counterparty's main working loop. Interstice broadcasts a\nrequest for quote on a pair, counterparties quote, and the initiator selects one. There is\nno resting order book here — that is the Convene section, a different product on the same\ngateway.\n\n**Arming the hashlock is the handoff from quoting to settlement.** On an ONRAMP, the\ncounterparty whose quote was selected generates the secret for the atomic swap, and posts\nits SHA-256 hash to `arm-hashlock` so the value is frozen into the commitment before the\ninstitution commits. It is terminal: the first value armed is final, and losing the secret\ncosts you the swap. OFFRAMP has no arm step — the institution supplies the hashlock at\ncommit, because on that direction it is the one generating the secret."},{"name":"Swaps","description":"A swap settles atomically against a hashed timelock contract (HTLC): both legs lock\nagainst the same hashlock, so revealing the secret to claim one leg reveals it for the\nother. Either both legs settle or both refund. Nobody is trusted to complete their side.\n\n**From the counterparty's side.** On ONRAMP you are the secret generator: you lock Canton\nCoin first, wait for the institution to lock the external asset, then claim the external\nleg — which reveals your secret and lets the institution claim the Canton leg. On OFFRAMP\nthe roles invert: the institution locks Canton Coin, you lock the external asset, the\ninstitution claims external and reveals, and you claim the Canton leg last with the\nnow-public secret.\n\nCanton locks first in both directions; the lifecycle page explains why. Every primitive\nhere is prepare-then-submit because Interstice never holds your key. If the other side\nnever completes, each locker refunds their own leg once its timelock expires — but only\nbefore the secret is revealed; after that the swap can only complete."},{"name":"Reports","description":"Verified on-chain state transitions. You report what you did on-chain; Interstice checks\nthe claim against the ledger before advancing the swap.\n\nThese are verifications, not assertions taken on trust — a report whose on-chain evidence\ndoes not match the swap is rejected rather than recorded."},{"name":"Webhooks","description":"How Interstice pushes events to you instead of you polling — how an always-on bot learns\nan RFQ is available. Register an endpoint, inspect deliveries, and replay one that failed.\n\nDeliveries carry `X-Webhook-Event` and `X-Webhook-Signature`. **Verify the signature over\nthe raw body before trusting a payload.** The signing secret is shown once at registration\nand can be rotated without re-registering."},{"name":"Automations","description":"You administer automations here, reachable only with an entity key (`cpk_…`). Create an\nautomation, mint its `auto_…` credentials, grant it a scoped authority to act on your\nbehalf, and revoke any of that — key, grant, or automation. Pause and resume are the\nfast off-switches.\n\n**An automation holds its own key and can never sign as the owner**, and it cannot widen\nits own authority — every operation on this page is refused to an automation credential.\nThat separation is what makes an unattended bot a bounded risk rather than a copy of your\nowner key."},{"name":"Executions","description":"A bot spends its grant here, reachable only with an `auto_…` automation credential. See\nwhat it may do, prepare and submit an execution, and list what it has already done — this\nis where a settlement bot executes the choices its grants permit.\n\nIt cannot mint keys, create wallets, or change its own grants — those are Automations\noperations and are rejected here. Execution is prepare-then-submit like everywhere else:\nInterstice builds the transaction, the automation signs it with its own key, and Interstice\nsubmits it."},{"name":"Market data","description":"The venue's read surface: the tradeable market catalog, instrument lookups, and the\nresting order book. Reading takes no position and consumes no liquidity — but it is not\nanonymous. Every route on this gateway requires a key.\n\nConvene is a protocol family and swap is one protocol within it, which is why the mount\nreserves `/convene/swap/**`. Other protocols will sit beside it, not underneath it."},{"name":"Maker","description":"Posting resting liquidity: submit a resting order, cancel it, and list your own orders\nand fills. A maker puts a price on the book and waits; a taker crosses it. This is the\nhalf of the venue that cross-chain swap has no equivalent for — there, you quote on\nrequest rather than resting an order.\n\n**Makers pay no fee.** The venue charges the taker, on the order that crosses your\nliquidity — so resting an order costs you nothing beyond the funding it commits."},{"name":"Taker","description":"Taking resting liquidity: submit a taker order against the book, cancel one that has not\nsettled, and await or inspect an order's outcome.\n\nThe fee a taker pays rides on the order messages themselves, so it is visible where it is\ncharged rather than looked up from a profile endpoint beforehand."},{"name":"Settlement","description":"What happens after a match: submitting the signed transactions the venue prepares,\nchecking what is still pending, and recovering funding when a match does not complete.\n\nAs everywhere on this API, the venue prepares and you sign — it never holds your key, so\nsettlement is a loop of prepare, sign, submit rather than a single call."}],"x-tagGroups":[{"name":"Getting started","tags":["Authentication","Setup","Discovery"]},{"name":"Wallets","tags":["Wallets"]},{"name":"Cross-chain swap","tags":["Pairs","RFQ","Swaps","Reports"]},{"name":"Convene swap","tags":["Market data","Maker","Taker","Settlement"]},{"name":"Automation","tags":["Automations","Executions"]},{"name":"Account","tags":["Profile","Webhooks"]}],"components":{"securitySchemes":{"bearerAuth":{"type":"http","scheme":"bearer","description":"Swap-side API key as a Bearer token — an ENTITY key (`cpk_…`) for the owner plane and swap/RFQ/webhook surfaces, or an AUTOMATION key (`auto_…`) for the `/executions/*` plane. The cp-gateway validates it and injects an entity-scoped principal; a counterparty never holds a credential that reaches swap-api directly. Identity `isk_…` keys are NOT accepted at this gateway."}},"schemas":{"CpErrorEnvelope":{"type":"object","properties":{"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"details":{"type":"object","additionalProperties":{}}},"required":["code","message"]}},"required":["error"]},"CpConfigAsset":{"type":"object","properties":{"symbol":{"type":"string","description":"Asset symbol, e.g. \"ETH\" or \"CC\"."},"chain":{"type":"string","description":"Logical chain the asset lives on — an open string (ethereum/base/solana/canton); new chains land as data."},"family":{"type":"string","enum":["evm","svm","canton"],"description":"Settlement family of the chain. Dispatch signers/encoders on this, never on the chain name."},"decimals":{"type":"integer","description":"On-chain decimals (informational only — every amount on the wire is a whole-unit decimal string)."},"address":{"type":"string","
