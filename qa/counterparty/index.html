  <script id="api-reference" type="application/json">{"openapi":"3.1.0","info":{"title":"Interstice Counterparty (CP) External API","version":"v1","description":"You are connecting as a **Liquidity Provider** on the Interstice Swap Engine.\nInstitutions request quotes; you make markets; both legs settle atomically\nbetween Canton Network and an enabled EVM or Solana network. Either the whole\nswap completes or every leg refunds. There is no state in which one side pays\nand the other does not.\n\nYou never talk to the orchestrator directly. You talk to the **counterparty\ngateway**. Interstice issues two things when your organization is accepted:\n\n| You receive | What it is |\n|---|---|\n| Gateway URL (`CP_GATEWAY_URL`) | Hostname for this environment, including the `/swap` prefix. Dev, QA, and production are different hosts and different key spaces. |\n| Entity API key (`cpk_…`) | The secret that authenticates your organization. Shown once. This **is** authentication — there is no login session on this plane. |\n\nPaste that key into this page's client. The first request is **First\nsuccessful call** under Authentication (`GET /config`) — use the language\ndropdown there. Wire only the URL and the key; discover the rest.\n\n## What we do and what you do\n\nWe prepare unsigned transactions and verify on-chain events. **You sign.** Your\nCanton Ed25519 key and your EVM or Solana signer never leave your process. We\ncannot move your funds. That is the product, not a setting.\n\nThere are two planes on the same gateway and the same key:\n\n- **Swap** — RFQ, quotes, HTLC settlement. This is the default path in these\n  pages.\n- **Convene** — a non-custodial spot order book on Canton. Same authentication,\n  different routes. See Convene when you need it.\n\n## Three pages, in order\n\n1. **[Authentication](#tag/authentication)** — the `cpk_…` key you were given,\n   how to make a first successful call, and how you mint, list, and revoke\n   further keys yourself. API keys are the authentication mechanism; they are\n   not a separate product.\n2. **[Setup](#tag/setup)** — you still cannot trade. Setup is the ceremony that\n   puts *your* Canton wallet on *our* participant so we can prepare ledger\n   commands as you. You create the key; we never generate it. When setup is\n   done you have a hosted party, inbound Canton Coin, and a second (bot)\n   credential for the always-on process.\n3. **Integration** — quote RFQs, verify webhooks, settle.\n\nThe generated contract is the API Reference. It is\nproduced from `external-openapi.json`. Treat that file, not a GitBook copy, as\ncurrent.\n\n## What this is not\n\n- Not the institution (taker) product. You will not see taker reports or other\n  organizations' data.\n- Not Identity login. Portal JWTs and Identity `isk_…` keys are rejected at\n  the gateway.\n- Not a custodian. Default integration (Pattern 1b) hosts **your** key on our\n  participant. If you already run a Canton validator you can stay self-hosted\n  (Pattern 1a) and skip the relay. See Architecture.\n"},"servers":[{"url":"https://{gatewayHost}/swap/external/cp/v2","variables":{"gatewayHost":{"default":"api.interstice.io","description":"Per-environment cp-gateway hostname, provided at onboarding (dev / qa / production differ)."}}}],"tags":[{"name":"Authentication","description":"There is no username and no Identity session on this plane. You authenticate\nwith an **API key** on every request. Paste it into this page's client\n(`Authorization: Bearer`). Keys do not work across environments\n(`cpk_live_…` vs `cpk_test_…`).\n\nWhen your organization is accepted, Interstice issues the first entity key\nout of band. Shown **once**. Put it in a secret manager the same day. After\nthat, **you** mint, list, and revoke further keys with the three operations\non this page.\n\nThat first key authenticates the **organization**, not a person and not a\nCanton party. It is enough to register wallets, run Setup, quote, and mint\nmore keys. It is **not** what you put in an always-on settlement bot — that\nbot gets a narrower `auto_…` key after Setup.\n\n## First successful call\n\nUse the language dropdown on **First successful call** below (`GET /config`).\nCurl, Python, Node, and the rest are generated from the operation — there is\nno separate SDK snippet. A 200 with `pairs` and `networks` means the key\nworks.\n\n| Status | Meaning |\n|---|---|\n| 401 | Missing, unknown, revoked, or not a swap-side key. Identity `isk_…` keys land here. |\n| 403 | The key resolved but is not allowed on this route (wrong role, or an `auto_…` credential on an owner-plane path). |\n| 429 | More than 600 requests/min on this key. `Retry-After` is in seconds. |\n\n## Two families\n\n| Key | Who creates it | Holds it | What it is for |\n|---|---|---|---|\n| `cpk_…` | Interstice (first one), then **you** below | Operators, secret manager, bootstrap jobs | Owner plane: wallets, setup, funding, automations, grants, quoting, webhooks, minting keys |\n| `auto_…` | You, per automation, after Setup | The settlement bot only | Runtime only. Cannot mint keys, run setup, or widen its own authority |\n\n## Mint, list, revoke\n\nRaw secrets are returned **once**. List responses carry truncated hashes\nonly. `{prefix}` on revoke is the **first 8 hex characters of `keyHash`**,\nnot the `cpk_test_ab12` display prefix.\n\nRotate without an outage: mint a new key → deploy it → revoke the old one.\nDo not revoke first. A leaked key is a self-service revoke, not a support\ncall. Do **not** mint `auto_…` here — those are minted per automation after\nSetup, they must expire (at most 400 days), and they 403 on this surface.\n\n## Next\n\nAuthentication is done when First successful call returns 200. You still\nhave no Canton party on our participant. That is Setup.\n"},{"name":"Setup","description":"You have a working API key. You still cannot settle a swap.\n\nSetup hosts **your** Canton key on **our** participant so we can prepare\ntransactions as you. You generate the keypair. You send us the **public**\nkey only — never the private key, never a seed, never a mnemonic. You sign\nevery topology and funding transaction. We never hold the private key, and\nno route on this page accepts one.\n\nA counterparty may hold as many Canton wallets as it wants (see\n[Create a second wallet](#create-a-second-wallet) below). Every operation\npast creation binds an explicit `walletId` — there is no implicit \"the\"\nwallet, so a multi-wallet organization is never guessing which one an\naction lands on.\n\nWhen this page is finished you have a hosted party, its Amulet factory\nprimed, inbound Canton Coin actually arriving (auto-accept), and a second\n(bot) key so the owner wallet stays cold. Only the entity key (`cpk_…`) can\nrun these routes. An `auto_…` key is 403.\n\nThe operations on this page use the same language dropdown as\nAuthentication. Signatures are **your** Ed25519 over the hashes we return —\nthe snippets show the HTTP, not the signing.\n\n## What you need\n\n- The `cpk_…` key from Authentication.\n- A Canton Ed25519 key you generate yourself (Interstice Wallet app, or your\n  HSM / custody). You send us the public key; we derive the party id and\n  return it — you never send us a party id to trust, and we recompute the\n  fingerprint ourselves regardless of what you send.\n- An EVM wallet on the same owner, `ready` — required for automation. The\n  grant will only ever pay that address.\n- An SVM (Solana) wallet only if you quote Solana pairs.\n\n## Five steps, one wallet\n\n1. **Create** (`POST /me/wallets/canton`) — send your public key, get back an\n   unsigned topology bundle.\n2. **Activate** (`POST /me/wallets/canton/:walletId/activate`) — sign it,\n   twice: once to host the party, once to prime its Amulet factory.\n3. **Fund it and check balance** (`GET /me/wallets/canton/:walletId`) — the\n   readiness gate, not an afterthought.\n4. **Set auto-accept** (preapproval) — with the revoke pair, so it isn't a\n   one-way door.\n5. **Ready-to-settle checklist** — every item is a field on the same detail\n   `GET`.\n\n### 1. Create\n\n`POST /me/wallets/canton` with `{ publicKey }`. That's the whole minimum\nbody — `hint` and `metadata` (see [Metadata](#metadata) below) are optional.\nWe never generate or hold the key behind that public key: you generate the\nEd25519 keypair, we only ever see the public half, and everything this route\nreturns is *unsigned* — a topology bundle for you to sign off-platform. This\nis the non-custody boundary, not a footnote on it.\n\nThe response:\n\n| Field | What it is |\n|---|---|\n| `walletId` | The id every later route binds to. Not a party id — save it. |\n| `partyId` | `{hint}::{fingerprint(publicKey)}`, computed and returned by us. We recompute this from your key regardless of anything you send — there is no `partyId` field in the request. |\n| `status` | `PENDING_SIGNATURE` on a fresh wallet. |\n| `isPrimary` | A hint for your own UI. Read-only this release — the first Canton wallet on the chain takes the slot; every later one registers `false`. |\n| `topologyTxs` | The unsigned bundle. Sign each and move to Activate. |\n\nRe-posting the same public key is safe: if the wallet is still\n`PENDING_SIGNATURE` you get it back (200, not 201) with a fresh\n`topologyTxs` bundle — the first one expires after 10 minutes uncommitted.\n\n### 2. Activate\n\nTwo round trips on the **same URL**, `POST /me/wallets/canton/:walletId/activate`\n— the body shape tells the server which phase you're in. This is two calls\nbecause hosting the party and priming its Amulet factory are two separate\non-ledger operations, and both need *your* signature. We hold no key that\ncould sign either for you, so there is no way to collapse this to one call\nwithout custody — the extra round trip is the non-custody boundary being\ncharged, not ceremony for its own sake.\n\n**Phase 1 — host the party.** Sign each `topologyTxs[].hash` from Create\nwith your owner key and send them back:\n\n```\nPOST /me/wallets/canton/:walletId/activate\n{ \"signedTxs\": [{ \"signedHash\": \"...\", \"signedBy\": \"<your public key>\" }] }\n```\n\nThe response is `status: ACTIVE` (already primed — rare, but possible on a\nre-run) or `status: PENDING_FACTORY` with a `factory` object: a prepared\ntransaction for the Amulet factory create.\n\n**Phase 2 — prime the factory.** Only when phase 1 left you at\n`PENDING_FACTORY`. Sign the prepared transaction from that response and send\nit back on the *same* URL:\n\n```\nPOST /me/wallets/canton/:walletId/activate\n{ \"factory\": { \"preparedTransaction\": \"...\", \"preparedTransactionHash\": \"...\",\n               \"hashingSchemeVersion\": \"...\", \"signatureBase64\": \"...\" } }\n```\n\n`status: ACTIVE` means hosted **and** primed. A wallet that is hosted but\nnot primed cannot lock Canton Coin — the first settlement attempt would 409,\nnot the tenth. If a platform adapter upgrade ever un-primes a wallet, it\ndrops back to `PENDING_FACTORY` and phase 2 is how you re-prime it; there is\nno separate \"re-prime\" button.\n\n### 3. Fund it and check balance\n\n`GET /me/wallets/canton/:walletId` returns every supported token balance —\nnot just Canton Coin, so you don't need a second call per instrument. This\nis the readiness gate, not a convenience read: a hosted, primed wallet with\nzero Canton Coin still cannot lock, so an unfunded wallet fails at the first\nRFQ rather than here at setup. Check it before you consider setup done.\n\nThen **you** send CC to the `partyId` from Create — we do not fund you.\n\n### 4. Set auto-accept\n\nInbound Canton Coin is auto-accepted only while a **TransferPreapproval** is\nlive on the party. Without one, a deposit strands as a Pending\nTransferInstruction with no accept path. You sign it; the platform cannot.\n\n**Turn it on:**\n\n```\nPOST /me/wallets/canton/:walletId/preapproval/prepare   →  unsigned tx (or\n                                                             ACTIVE, no-op)\nPOST /me/wallets/canton/:walletId/preapproval/submit     →  sign, relay\n```\n\n**Turn it off** — this used to have no path at all; it does now, alongside\nthe pair above so it's documented as a matched set, not an afterthought:\n\n```\nPOST /me/wallets/canton/:walletId/preapproval/revoke/prepare  →  unsigned tx\n                                                                   (or NONE)\nPOST /me/wallets/canton/:walletId/preapproval/revoke/submit   →  sign, relay\n```\n\n**Review it on a cadence.** Subscribe to `preapproval.expiring` (fires 24\nhours before expiry), or re-read the detail `GET`'s `preapproval.expiresAt`.\nRenew with the same prepare → sign → submit path; a new `expiresAt` re-arms\nthe alert.\n\n### 5. Ready-to-settle checklist\n\nEvery item below is a field on the same `GET /me/wallets/canton/:walletId`\n— one call answers \"can this wallet settle?\" instead of four.\n\n| You are done when | Field |\n|---|---|\n| The wallet is hosted on our participant | `readiness.hosted: true` |\n| It holds Canton Coin (or whatever instrument the swap needs) | `readiness.funded: true`, checked against `balances[]` |\n| Auto-accept is live | `readiness.preapproved: true` |\n| The Amulet factory is primed | `readiness.factoryPrimed: true` |\n| All four together | `status: \"ACTIVE\"` |\n\n## Metadata\n\nAttach your own keys to a wallet at Create or later via\n`PATCH /me/wallets/canton/:walletId/metadata` — your internal account id,\ndesk, book, whatever helps you correlate. We store it, return it verbatim on\nevery `GET`, and never parse it, route on it, or use it for authorization —\nit is opaque to us by design.\n\nIt is **scoped to the swap product** and isolated from any other product's\nmetadata on the same wallet; you see your own keys directly (`{ \"accountId\":\n\"ACME-1\" }`), never wrapped in a namespace.\n\nBounds, checked on the merged result so a sequence of small patches can't\nwalk past the cap:\n\n| Rule | Limit |\n|---|---|\n| Value shape | Flat object — no nested objects or arrays as values |\n| Key count | 32 |\n| Serialized size | 4096 bytes |\n| Key format | ≤ 64 chars, `[A-Za-z0-9._-]` |\n| Value type | `string` (≤ 512 chars), `number`, `boolean`, or `null` |\n| Reserved keys | `kind`, `validator` — these are our own stamps, rejected on write |\n\n`PATCH { metadata: { \"desk\": null } }` deletes `desk` — a `null` value reads\nas gone on every later `GET`.\n\n## Create a second wallet\n\nMultiple Canton wallets per organization are fully supported — repeat\n[Create](#1-create) with a different public key:\n\n```\nPOST /me/wallets/canton\n{ \"publicKey\": \"<second Ed25519 public key, hex>\" }\n```\n\nThe response is the same shape, with its own `walletId` and `partyId`. Its\n`isPrimary` comes back `false` — the first wallet on the chain already holds\nthat slot, and this release ships no way to move it. Activate, fund, and set\nauto-accept on the new `walletId` exactly as above; nothing about a second\nwallet is a different code path.\n\n`GET /me/wallets/canton` lists every wallet you've created (no ledger\nreads — cheap to poll), and every swap or settlement route that touches a\nCanton wallet takes an explicit `walletId` for exactly this reason: with more\nthan one wallet, there is no \"the\" wallet for the platform to guess at.\n\n## After hosting\n\nDo not put the owner wallet key in an always-on process. Automation is a\n**different** Ed25519, an AutomationParty whose namespace is that key, and\nan `auto_…` API key minted under Automations (owner). Rotation is a new\nautomation, not a key swap.\n\nQuoting and settlement are later on this explorer (RFQ, Swaps, Signing).\nThe venue plane is the Convene explorer.\n"},{"name":"Wallets","description":"Canton wallet lifecycle — create and host as an external party (we never generate the key), fund, auto-accept, transfer — plus EVM/SVM wallet registration. A non-ACTIVE wallet blocks trading."},{"name":"Discovery","description":"Network / asset discovery. Start with GET /config — wire only the gateway URL and the entity key."},{"name":"Profile","description":"Counterparty profile & eligibility"},{"name":"RFQ","description":"RFQ feed & quoting (the market-making surface)"},{"name":"Swaps","description":"Own swaps (entity-scoped)"},{"name":"Signing","description":"Server-prepare thin-client Canton signing"},{"name":"Reports","description":"Verified on-chain state transitions"},{"name":"Webhooks","description":"Subscription & delivery ops"},{"name":"Automations (owner)","description":"Owner plane: automation lifecycle, keys, owner-signed grants (entity keys only — automation credentials 403)"},{"name":"Automation (data plane)","description":"Grant-choice execution plane (automation keys only, scope-gated)"}],"components":{"securitySchemes":{"bearerAuth":{"type":"http","scheme":"bearer","description":"Swap-side API key as a Bearer token — an ENTITY key (`cpk_…`) for the owner plane and swap/RFQ/webhook surfaces, or an AUTOMATION key (`auto_…`) for the `/automation/*` execution data plane. The cp-gateway validates it and injects an entity-scoped principal; a counterparty never holds a credential that reaches swap-api directly. Identity `isk_…` keys are NOT accepted at this gateway."}},"schemas":{"CpErrorEnvelope":{"type":"object","properties":{"error":{"type":"object","properties":{"code":{"type":"string"},"message":{"type":"string"},"details":{"type":"object","additionalProperties":{}}},"required":["code","message"]}},"required":["error"]},"CpConfigAsset":{"type":"object","properties":{"symbol":{"type":"string","description":"Asset symbol, e.g. \"ETH\" or \"CC\"."},"chain":{"type":"string","description":"Logical chain the asset lives on — an open string (ethereum/base/solana/canton); new chains land as data."},"family":{"type":"string","enum":["evm","svm","canton"],"description":"Settlement family of the chain. Dispatch signers/encoders on this, never on the chain name."},"decimals":{"type":"integer","description":"On-chain decimals (informational only — every amount on the wire is a whole-unit decimal string)."},"address":{"type":"string","description":"Token contract address (EVM) or mint address (SVM). Absent for a native asset."},"eip155ChainId":{"type":"integer","description":"EIP-155 chain id of the enabled physical network. EVM only; absent for SVM and Canton assets."},"identityChainId":{"type":"string","description":"Physical identity chain id (the `identityChainId` used for wallet registration), when this deployment operates the chain."},"instrumentId":{"type":"string","description":"CIP-56 instrument id. Canton-side assets only."},"instrumentAdmin":{"type":"string","description":"CIP-56 instrument admin party. Canton-side assets only."}},"required":["symbol","chain","family","decimals"]},"CpConfigPair":{"type":"object","properties":{"id":{"type":"string","description":"Registry pair id, e.g. \"eth-cc\". This is the identifier a grant policy's `allowedPairs` requires (lowercased) — NOT the slash key."},"key":{"type":"string","description":"Canonical \"<EVMASSET>/<CANTONASSET>\" display key, e.g. \"ETH/CC\". Carried by RFQ `pair`; use `id` for authorization."},"status":{"type":"string","enum":["live","coming_soon"],"description":"\"live\" = quotable/tradeable and selectable; \"coming_soon\" = visible roadmap, not selectable. Disabled pairs never appear here."},"base":{"$ref":"#/components/schemas/CpConfigAsset"},"quote":{"$ref":"#/components/schemas/CpConfigAsset"}},"required":["id","key","status","base","quote"]},"CpConfigEvmNetwork":{"type":"object","properties":{"family":{"type":"string","enum":["evm"]},"chainId":{"type":"integer","description":"EIP-155 numeric chain id used by EVM clients."},"name":{"type":"string"},"identityChainId":{"type":"string","description":"Identity service chain id used when registering the EVM wallet."},"logicalChain":{"type":"string","description":"Logical settlement chain (ethereum/base/robinhood_chain/…)."},"htlcAddress":{"type":"string","pattern":"^0x[0-9a-fA-F]{40}$","description":"HTLC contract deployed for this network."}},"required":["family","chainId","name","identityChainId","logicalChain","htlcAddress"]},"CpConfigSvmNetwork":{"type":"object","properties":{"family":{"type":"string","enum":["svm"]},"name":{"type":"string"},"identityChainId":{"type":"string","description":"Identity service chain id used when registering the SVM wallet."},"logicalChain":{"type":"string","description":"Logical settlement chain (solana)."},"cluster":{"type":"string","enum":["devnet","testnet","mainnet-beta","localnet"],"description":"Solana cluster this network runs on."},"genesisHash":{"type":"string","description":"Genesis hash of the cluster — verify your RPC endpoint against it."},"programId":{"type":"string","description":"Settlement program id deployed for this network."},"feeConfigPda":{"type":"string","description":"Fee-config PDA of the settlement program."},"commitment":{"type":"string","enum":["finalized"],"description":"Commitment level every settlement read/verification uses."}},"required":["family","name","identityChainId","logicalChain","cluster","genesisHash","programId","feeConfigPda","commitment"]},"CpConfigNetwork":{"oneOf":[{"$ref":"#/components/schemas/CpConfigEvmNetwork"},{"$ref":"#/components/schemas/CpConfigSvmNetwork"}],"discriminator":{"propertyName":"family","mapping":{"evm":"#/components/schemas/CpConfigEvmNetwork","svm":"#/components/schemas/CpConfigSvmNetwork"}}},"CpConfig":{"type":"object","properties":{"networks":{"type":"array","items":{"$ref":"#/components/schemas/CpConfigNetwork"}},"canton":{"type":"object","properties":{"synchronizerId":{"type":"string"},"packageId":{"type":"string"},"scanUrl":{"type":"string","format":"uri"}},"required":["synchronizerId","packageId","scanUrl"],"description":"Canton coordinates the signer needs: synchronizer id, swap package id, and the scan URL."},"assets":{"type":"array","items":{"$ref":"#/components/schemas/CpConfigAsset"},"description":"Every asset that participates in at least one non-disabled pair (placeholder assets are omitted)."},"pairs":{"type":"array","items":{"$ref":"#/components/schemas/CpConfigPair"},"description":"Cataloged trading pairs with per-pair status and the id↔key mapping — the source of truth for discovery, supported-pairs selection, and the pair IDS a grant policy requires."},"platform":{"type":"object","properties":{"minSwapUsd":{"type":"number"},"maxSwapUsd":{"type":"number"},"maxFeeBps":{"type":"integer"},"maxSlippageBps":{"type":"integer"}},"required":["minSwapUsd","maxSwapUsd","maxFeeBps","maxSlippageBps"]}},"required":["networks","canton","assets","pairs","platform"]},"CpProfile":{"type":"object","properties":{"entityId":{"type":"string"},"name":{"type":"string"},"status":{"type":"string","description":"Identity-owned compliance/eligibility status; only an eligible, onboarded CP can quote or trade."},"cantonOnboarded":{"type":"boolean","description":"True when identity reports COMPLIANT. Canton trading uses the Interstice wallet, not a companion table party."},"supportedPairIds":{"type":"array","items":{"type":"string"},"description":"Canonical exact trading-pair ids. This field is authoritative for authorization."},"supportedPairsMode":{"type":"string","enum":["default","explicit"],"description":"How supportedPairIds was derived: \"default\" = no stored selection, so every currently-live pair is effective and re-evaluated per read; \"explicit\" = a stored exact-id selection governs."}},"required":["entityId","name","status","cantonOnboarded","supportedPairIds","supportedPairsMode"]},"CpSupportedPairsInput":{"type":"object","properties":{"supportedPairIds":{"type":"array","items":{"type":"string","minLength":1},"description":"Exact live trading-pair ids. An EMPTY array reverts to the dynamic default."}},"required":["supportedPairIds"]},"CpFee":{"type":"object","properties":{"tier":{"type":"string"},"platformFeeBps":{"type":"integer"}},"require
